<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jackmo 👨</title>
</head>
<body>
<h1>Jackmo 👨</h1>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<div id="my-apo"></div>
    <script type="text/babel">
      function My-apo() {
        return import React, { useState } from "react";
import JSZip from "jszip";

const ScratchJrAnalyzer = () => {
  const [progress, setProgress] = useState(0);
  const [error, setError] = useState("");
  const [stats, setStats] = useState(null);

  const allowedExt = [".scratchjr", ".sjr", ".jrs"];

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const name = file.name.toLowerCase();
    const ok = allowedExt.some(ext => name.endsWith(ext));
    if (!ok) {
      setError("Only .scratchjr, .sjr, or .jrs files are allowed.");
      return;
    }

    setError("");
    setStats(null);
    setProgress(5);

    try {
      const buffer = await file.arrayBuffer();
      setProgress(20);

      const zip = await JSZip.loadAsync(buffer);
      setProgress(40);

      // ScratchJr always stores project.json at root
      const projectJson = await zip.file("project.json").async("string");
      setProgress(55);

      const project = JSON.parse(projectJson);

      // Count assets
      let assetCount = 0;

      // ScratchJr stores images/sounds inside assets/
      const assetFolder = zip.folder("assets");
      if (assetFolder) {
        assetFolder.forEach((relativePath, fileObj) => {
          assetCount++;
        });
      }

      // Count code blocks
      let blockCount = 0;

      // ScratchJr JSON structure:
      // project.pages[i].sprites[j].scripts[k].blocks[]
      project.pages.forEach(page => {
        page.sprites.forEach(sprite => {
          sprite.scripts.forEach(script => {
            blockCount += script.blocks.length;
          });
        });
      });

      setProgress(100);
      setStats({ assetCount, blockCount });

    } catch (err) {
      console.error(err);
      setError("Failed to parse ScratchJr project.");
    }
  };

  return (
    <div style={{ maxWidth: 400 }}>
      <h2>ScratchJr Project Analyzer</h2>

      <input
        type="file"
        accept=".scratchjr,.sjr,.jrs"
        onChange={handleFile}
      />

      {error && <p style={{ color: "red" }}>{error}</p>}

      <div style={{ marginTop: 10 }}>
        <div style={{
          height: 10,
          background: "#ddd",
          borderRadius: 5,
          overflow: "hidden"
        }}>
          <div style={{
            width: `${progress}%`,
            height: "100%",
            background: "#4caf50",
            transition: "width 0.3s"
          }} />
        </div>
        <small>{progress}%</small>
      </div>

      {stats && (
        <div style={{ marginTop: 10 }}>
          <p><strong>Assets:</strong> {stats.assetCount}</p>
          <p><strong>Code blocks:</strong> {stats.blockCount}</p>
        </div>
      )}
    </div>
  );
};

export default ScratchJrAnalyzer;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<My-apo />);
    </script>
</body>
</html>
